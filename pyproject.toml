[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-aar"
version = "0.1.0"
description = "Open Battery Agents hackathon prototype for Attia/Chueh fast-charging replay and agentic rediscovery."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.10",
  "scikit-learn>=1.2",
  "h5py>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]
agents = [
  "openai>=1.40",
  "pydantic>=2",
  "tenacity>=8",
  "python-dotenv>=1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

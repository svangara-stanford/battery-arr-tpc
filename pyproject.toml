[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-aar"
version = "0.1.0"
description = "Open Battery Agents hackathon prototype for Attia/Chueh fast-charging replay and agentic rediscovery."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.10",
  "scikit-learn>=1.2",
  "h5py>=3.8",
  "eval-type-backport>=0.2.0; python_version < \"3.10\"",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "fastapi>=0.110",
  "httpx>=0.27",
  "uvicorn>=0.29",
]
agents = [
  "openai>=1.40",
  "pydantic>=2",
  "tenacity>=8",
  "python-dotenv>=1",
]
tools = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "uvicorn>=0.29",
]
rag = [
  "pymupdf>=1.24",
  "bm25s>=0.2",
  "PyStemmer>=2.2",
  "hnswlib>=0.8",
  "openai>=1.40",
  "python-dotenv>=1",
  "sentence-transformers>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
